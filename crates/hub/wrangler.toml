# 허브 — 공개 Worker + Durable Object Hub. 에이전트(/agent/*)·실시간 연결(/ws/*)·/healthz 만 받는다.
# 화면과 /api/* 는 Access 로 보호한 webdesktop-app 이 DO 에 직접 붙는다 (decision-log DL-10).
# 같은 계정에 listing 앱이 있다 → 자원 이름은 모두 webdesktop- 접두 (AGENTS.md).
name = "webdesktop-hub"
main = "build/index.js"
compatibility_date = "2026-11-01"

[build]
command = "cargo install -q \"worker-build@^0.9\" && worker-build --release"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# 설치 파일(E-12) — 키 `windows/webdesktop-agent.exe`. 로그인 없는 설치 링크가 토큰 확인 뒤 내려준다.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "webdesktop-releases"

[observability]
enabled = true

# Access 토큰 검증용 공개값 (webdesktop-app 의 Worker Access 앱, 2026-11-23 설정). 비밀 아님.
[vars]
ACCESS_TEAM_DOMAIN = "smartfactorystudy.cloudflareaccess.com"
# 설치 링크(E-03)에 넣는 공개 허브 주소. 시험 때는 .dev.vars 가 로컬 주소로 덮는다.
HUB_PUBLIC_URL = "https://webdesktop-hub.sangchane87.workers.dev"
ACCESS_AUD = "593d67ea7c777f0c53d4af8619ba89c064f3e12c8f8ddb4997ed9f9d2104d58b"
