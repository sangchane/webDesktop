<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>WebDesktop</title>
  <link data-trunk rel="rust" data-bin="web">
  <style>
    /* 토큰 — DESIGN.md 표가 기준. */
    :root {
      --canvas: #08090a; --surface-1: #0f1011; --surface-2: #18191a; --hairline: #23252a;
      --ink: #f7f8f8; --ink-muted: #8a8f98; --accent: #5e6ad2; --ok: #27a644; --warn: #d9a13b;
      --sans: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 16px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0; }
    p { margin: 0; }

    .page { max-width: 560px; margin: 0 auto; min-height: 100dvh; padding: max(16px, env(safe-area-inset-top)) 16px 32px; display: grid; align-content: start; gap: 16px; }
    .bar { display: flex; align-items: center; gap: 12px; min-height: 44px; }
    .bar h1 { flex: 1; }
    .icon { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--hairline); background: var(--surface-1); font-size: 20px; }
    .link { background: none; border: 0; padding: 8px 0; color: var(--ink-muted); font-size: 14px; }
    .primary, .secondary { min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 500; justify-self: start; }
    .primary { background: var(--accent); border: 0; color: #fff; }
    .secondary { background: var(--surface-1); border: 1px solid var(--hairline); }
    .muted { color: var(--ink-muted); font-size: 14px; }

    .notice, .stale { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 12px; background: var(--surface-2); font-size: 14px; }
    .notice span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .stale { color: var(--warn); }

    .devices { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .device { width: 100%; min-height: 64px; display: grid; grid-template-columns: 12px 1fr auto; column-gap: 12px; align-items: center; text-align: left;
              padding: 12px 16px; border-radius: 12px; border: 1px solid var(--hairline); background: var(--surface-1); }
    .device:active { background: var(--surface-2); }
    .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink-muted); }
    .dot.on { background: var(--ok); border-color: var(--ok); }
    .name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
    .go { grid-row: 1 / 3; grid-column: 3; color: var(--ink-muted); font-size: 14px; }
    .sub { grid-column: 2; color: var(--ink-muted); font-size: 14px; }
    .sub .on { color: var(--ok); }
    .sub .warn { color: var(--warn); }
    .skeleton { height: 64px; border-radius: 12px; background: var(--surface-1); }
    .empty { display: grid; gap: 16px; padding: 32px 0; color: var(--ink-muted); }

    .steps { margin: 0; padding-left: 24px; display: grid; gap: 24px; }
    /* 번호가 실제 순서 — li 를 grid 로 바꾸면 번호가 사라진다. */
    .steps li { padding-left: 4px; }
    .steps li > * + * { margin-top: 8px; }
    .steps li::marker { color: var(--ink-muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    a.primary { display: inline-flex; align-items: center; text-decoration: none; }
    /* 링크는 보조 — 글 시작선을 단계 글과 맞춘다(상자 안쪽 여백이 3px 어긋난 선을 만들었다). */
    .link-text { display: block; font: 12px/1.4 var(--mono); color: var(--ink-muted); overflow-wrap: anywhere; }
    .code { font: 500 28px/1.2 var(--mono); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }

    /* 원격 화면 — 모션 없음. */
    .remote { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr auto auto; background: #000; }
    .stage { position: relative; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .stage video { width: 100%; height: 100%; object-fit: contain; display: block; transform-origin: 0 0; }
    .cursor { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #000; pointer-events: none; }
    .path { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 8px; padding: 2px 8px; border-radius: 8px; background: rgb(15 16 17 / 0.8); color: var(--ink-muted); font-size: 12px; }
    .hint { position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 8px 12px; border-radius: 8px; background: rgb(15 16 17 / 0.85); color: var(--ink); font-size: 14px; text-align: center; pointer-events: none; }
    .status { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 16px; text-align: center; background: rgb(8 9 10 / 0.85); }
    .kb { position: fixed; bottom: 0; left: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0; resize: none; }
    /* 폰 폭에 9개가 한 줄로 — 칸을 똑같이 나눈다(끊기가 밀려 잘리지 않게). */
    .keys { display: flex; gap: 4px; padding: 8px 8px max(8px, env(safe-area-inset-bottom)); background: rgb(15 16 17 / 0.92); }
    .key { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0; border-radius: 8px; border: 1px solid var(--hairline); background: var(--surface-2); font-size: 14px; white-space: nowrap; }
    .key.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .key.end { color: var(--warn); }
    .zoom { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 8px; min-height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--hairline); background: rgb(15 16 17 / 0.85); font-size: 12px; font-variant-numeric: tabular-nums; }
    .kbd-open .keys { padding-bottom: 8px; }
    /* 가상 키보드 — 화면을 가리지 않고 아래에 붙는다(무대가 줄어든다). 키 높이는 세로 폰 44px 안팎, 가로 폰 34px 이상. */
    .vkbd { display: grid; gap: 6px; padding: 6px 4px max(6px, env(safe-area-inset-bottom)); background: var(--surface-1); touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    .vrow { display: flex; gap: 4px; }
    .vrow.inset { padding-inline: 5%; }
    .vk { flex: 1 1 0; min-width: 0; height: clamp(34px, 5.5dvh, 46px); padding: 0; border: 0; border-radius: 8px; background: var(--surface-2); font-size: 18px; }
    .vk.mod { background: var(--hairline); font-size: 14px; }
    .vk.wide { flex-grow: 2; }
    .vk.space { flex-grow: 4; font-size: 14px; color: var(--ink-muted); }
    .vk:active, .vk.on { background: var(--accent); color: #fff; }
    .menu { inset: auto 8px calc(68px + env(safe-area-inset-bottom)) auto; margin: 0; padding: 12px; min-width: 240px; border-radius: 12px; border: 1px solid var(--hairline); background: var(--surface-1); color: var(--ink); gap: 8px; }
    .menu:popover-open { display: grid; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .item { min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--surface-2); font-size: 14px; }
    .item.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body></body>
</html>
